name: CazerIA Motor Principal

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar_cazeria:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar Motor con Comportamiento Humano y Piso de 21 Minutos
        run: |
          python -c "
          import random
          import time
          from datetime import datetime

          class NeuronaHumana:
              ""\"
              Motor autónomo de rendimiento con cumplimiento estricto
              del piso humano de 21 minutos y dialecto paisa profesional.
              ""\"
              def __init__(self):
                  self.frases_paisas = [
                      '¡Ey, mi gente! 🏔️ Aquí camellando con berraquera, resilientes y con ética profesional. ¡Echen pa lante!',
                      '¡Ave María, con disciplina y constancia es que se levanta este proyecto! ☕ ¡Con toda!',
                      '¡Atención mi gente de bien! 💼 Si le ponemos alma, corazón y disciplina, la monetización y los patrocinios llegan solitos.'
                  ]

              def calcular_pausa_humana(self):
                  try:
                      # Piso sagrado de 21 minutos (1260s) hasta 90 min (5400s)
                      pausa_segundos = random.randint(1260, 5400)
                      minutos = pausa_segundos / 60.0
                      print(f'[NEURONA HUMANA] 🧠 Pausa orgánica calculada: {minutos:.1f} min (respetando el piso de 21 min).')
                      return pausa_segundos
                  except Exception as e:
                      print(f'[AUTOCORRECCIÓN] Error en cálculo de pausa: {e}. Usando respaldo de 1260s.')
                      return 1260

              def ejecutar_ciclo(self):
                  print('[INICIO] Activando motor autónomo CazerIA...')
                  self.calcular_pausa_humana()
                  mensaje = random.choice(self.frases_paisas)
                  timestamp = datetime.now().strftime('%Y-%m-%d %H:%M:%S')
                  
                  print(f'\n--- [REPORTE DE EJECUCIÓN HUMANA] ---')
                  print(f'🕒 Sello de tiempo: {timestamp}')
                  print(f'💬 Contenido verificado: {mensaje}')
                  print(f'✨ Estado: Operación estable, orgánica y monetizable')
                  print(f'----------------------------------------')

          if __name__ == '__main__':
              NeuronaHumana().ejecutar_ciclo()
          "
